name: Promoções Livelo para LATAM Pass
on:
  schedule:
    - cron: "7 */2 * * *"    # a cada 2 horas
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  promos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tracker.py --promos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "bot-passagens"
          git config user.email "bot-passagens@users.noreply.github.com"
          git add dados
          git diff --staged --quiet || git commit -m "atualiza promoções avisadas"
          git pull --rebase
          git push
