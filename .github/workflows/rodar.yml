name: Rastrear passagens
on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas
  workflow_dispatch: {}       # permite rodar na mão pelo botão "Run workflow"
permissions:
  contents: write
jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fast-flights
      - run: python tracker.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar histórico
        run: |
          git config user.name "bot-passagens"
          git config user.email "bot-passagens@users.noreply.github.com"
          git add dados
          git diff --staged --quiet || git commit -m "atualiza histórico de preços"
          git push
